name: Update studies

on:
  schedule:
    # Every hour, a few minutes past the hour to avoid the busiest cron slot.
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

concurrency:
  group: update-studies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect studies
        run: node scripts/update.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- docs/data/studies.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/studies.json
          git commit -m "data: hourly refresh ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
            git pull --rebase
          done
